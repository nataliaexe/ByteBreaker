name: ByteBreaker CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
    
    - name: Run quick tests
      run: |
        python -c "from core.config import Config; c = Config(); print('Config OK')"
        python -c "from core.authorization import AuthorizationManager; print('Auth OK')"
        python -c "from core.logger import ByteBreakerLogger; print('Logger OK')"
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short || true
    
    - name: Run CLI help
      run: |
        python cli/main.py --help || true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install linting tools
      run: |
        pip install black flake8
    
    - name: Check formatting
      run: |
        black --check core/ modules/ cli/ api/ utils/ || true
    
    - name: Lint with flake8
      run: |
        flake8 core/ modules/ cli/ --max-line-length=100 --ignore=E501,W503 || true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install security tools
      run: |
        pip install bandit
    
    - name: Run security scan
      run: |
        bandit -r core/ modules/ cli/ -ll -ii || true

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t bytebreaker:latest . || true
